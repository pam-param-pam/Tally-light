name: Build Tally Transmitter

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
          cache: pip
          cache-dependency-path: transmiter/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r transmiter/requirements.txt pyinstaller

      - name: Build executable
        working-directory: transmiter
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --console
          --add-data "vendor/pyatemsim/default_config.xml;vendor/pyatemsim"
          --add-data "vendor/pyatemsim/LICENSE;vendor/pyatemsim"
          --name Tally-Transmitter
          --distpath ../output
          --workpath ../build/transmitter
          --specpath ../build
          gui.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tally-Transmitter-Windows
          path: output/Tally-Transmitter.exe
          if-no-files-found: error

      - name: Create GitHub release and attach executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "${{ github.sha }}" --generate-notes --title "$env:RELEASE_TAG"
          }
          gh release upload "$env:RELEASE_TAG" output/Tally-Transmitter.exe --clobber
