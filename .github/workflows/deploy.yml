name: Deploy Django Application

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Deploy via Cloudflare SSH
        uses: pam-param-pam/cloudflare-ssh-action@v1.0.0
        with:
          host: ${{ secrets.CI_DEPLOYMENT_HOST }}
          username: ${{ secrets.CI_RPI_USERNAME }}
          private-key: ${{ secrets.CI_RPI_SSH_KEY }}
          known-hosts: ${{ secrets.CI_RPI_SSH_KNOWN_HOSTS }}
          service-token-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          service-token-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          command: |
            set -e

            cd ~

            if [ -d "Tally-light/.git" ]; then
              echo "Tally-light repository exists. Updating it..."
              cd Tally-light
              git fetch origin
              git checkout master
              git pull --ff-only origin master
            else
              echo "Tally-light repository does not exist. Cloning it..."
              git clone --branch master https://github.com/pam-param-pam/Tally-light.git
              cd Tally-light
            fi

            cd relay

            echo "Writing environment file..."
            cat <<'EOF' > .env
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            EOF

            if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv
            fi

            source venv/bin/activate

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            sudo install -m 600 .env /etc/systemd/system/tally-light.env
            sudo install -m 644 tally-light.service /etc/systemd/system/tally-light.service

            sudo systemctl daemon-reload
            sudo systemctl restart tally-light
            sudo systemctl --no-pager --full status tally-light